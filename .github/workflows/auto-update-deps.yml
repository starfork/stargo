name: Auto Update Go Dependencies

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.4"

      - name: Update root module dependencies
        run: |
          go get -u ./...
          go mod tidy

      - name: Update contrib submodule dependencies
        run: |
          for dir in $(find . -name "go.mod" -not -path "./go.mod" ! -path './_samples/*' | sed 's|/go.mod||g'); do
            echo "=== Updating $dir ==="
            (cd "$dir" && go get -u ./... && go mod tidy) || echo "Failed to update $dir, continuing..."
          done

      - name: Build verification
        run: go build ./...

      - name: git config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet && git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.check.outputs.changed == 'true'
        run: |
          git add -A
          git commit -m "chore(deps): auto-update Go dependencies"
          git push origin main

      - name: Compute next tag
        if: steps.check.outputs.changed == 'true'
        id: tag
        run: |
          LATEST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$LATEST_TAG" ]; then
            echo "No semver tag found, defaulting to v0.0.0"
            LATEST_TAG="v0.0.0"
          fi
          echo "Latest root tag: $LATEST_TAG"

          MAJOR=$(echo "$LATEST_TAG" | cut -d. -f1 | tr -d 'v')
          MINOR=$(echo "$LATEST_TAG" | cut -d. -f2)
          PATCH=$(echo "$LATEST_TAG" | cut -d. -f3)
          NEXT_PATCH=$((PATCH + 1))
          NEXT_TAG="v${MAJOR}.${MINOR}.${NEXT_PATCH}"

          echo "next_tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"
          echo "Next tag: $NEXT_TAG"

      - name: Create and push all tags (root + submodules)
        if: steps.check.outputs.changed == 'true'
        run: |
          V=${{ steps.tag.outputs.next_tag }}

          # Root tag
          git tag "$V"
          echo "tagged: $V"

          # All submodule tags
          git tag "api/ratelimit/$V"
          git tag "broker/nats/$V"
          git tag "cache/redis/$V"
          git tag "config/etcd/$V"
          git tag "interceptor/ratelimit/redis/$V"
          git tag "interceptor/validator/$V"
          git tag "interceptor/zap/$V"
          git tag "logger/zap/$V"
          git tag "naming/etcd/$V"
          git tag "queue/store/redis/$V"
          git tag "store/mysql/$V"
          git tag "store/postgres/$V"
          git tag "store/redis/$V"
          git tag "tracer/jaeger/$V"

          git push origin --tags
