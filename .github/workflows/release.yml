name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        type: choice
        required: true
        default: "patch"
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Dry run (don't push)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.4"

      - name: Build verification
        run: go build ./...

      - name: Compute next version
        id: version
        run: |
          LATEST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$LATEST" ]; then
            echo "No semver tag found, defaulting to v0.0.0"
            LATEST="v0.0.0"
          fi
          echo "Latest: $LATEST"

          MAJOR=$(echo "$LATEST" | cut -d. -f1 | tr -d 'v')
          MINOR=$(echo "$LATEST" | cut -d. -f2)
          PATCH=$(echo "$LATEST" | cut -d. -f3)

          case "${{ inputs.bump }}" in
            major)
              NEXT_MAJOR=$((MAJOR + 1))
              NEXT="v${NEXT_MAJOR}.0.0"
              ;;
            minor)
              NEXT_MINOR=$((MINOR + 1))
              NEXT="v${MAJOR}.${NEXT_MINOR}.0"
              ;;
            *)
              NEXT_PATCH=$((PATCH + 1))
              NEXT="v${MAJOR}.${MINOR}.${NEXT_PATCH}"
              ;;
          esac

          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "New version: $NEXT"

      - name: Create tags (dry-run)
        if: inputs.dry_run
        run: |
          V=${{ steps.version.outputs.next }}
          echo "[DRY RUN] Would create:"
          echo "  $V"
          echo "  api/ratelimit/$V"
          echo "  broker/nats/$V"
          echo "  cache/redis/$V"
          echo "  config/etcd/$V"
          echo "  interceptor/ratelimit/redis/$V"
          echo "  interceptor/validator/$V"
          echo "  interceptor/zap/$V"
          echo "  logger/zap/$V"
          echo "  naming/etcd/$V"
          echo "  queue/store/redis/$V"
          echo "  store/mysql/$V"
          echo "  store/postgres/$V"
          echo "  store/redis/$V"
          echo "  tracer/jaeger/$V"

      - name: Create and push all tags
        if: ${{ !inputs.dry_run }}
        run: |
          V=${{ steps.version.outputs.next }}

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git tag "$V"
          git tag "api/ratelimit/$V"
          git tag "broker/nats/$V"
          git tag "cache/redis/$V"
          git tag "config/etcd/$V"
          git tag "interceptor/ratelimit/redis/$V"
          git tag "interceptor/validator/$V"
          git tag "interceptor/zap/$V"
          git tag "logger/zap/$V"
          git tag "naming/etcd/$V"
          git tag "queue/store/redis/$V"
          git tag "store/mysql/$V"
          git tag "store/postgres/$V"
          git tag "store/redis/$V"
          git tag "tracer/jaeger/$V"

          git push origin --tags
